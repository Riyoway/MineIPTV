plugins { id 'multiloader-common' }

// The 1.21.1 NeoForge branch compiles the shared MineIPTV sources directly
// inside the NeoForge project so NeoForge userdev supplies the Minecraft classpath.
sourceSets {
    main {
        java.srcDir rootProject.file('common/src/main/java')
        resources.srcDir rootProject.file('common/src/main/resources')
    }
}
