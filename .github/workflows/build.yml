name: build
on:
  push:
  pull_request:

jobs:
  build-neoforge-1-21-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build NeoForge 1.21.1
        run: gradle :neoforge:build --stacktrace --no-daemon
      - name: Validate NeoForge JAR
        shell: bash
        run: |
          JAR=$(find neoforge/build/libs -maxdepth 1 -type f -name 'mineiptv-neoforge-*.jar' ! -name '*sources*' | head -n 1)
          test -n "$JAR"
          unzip -t "$JAR"
          python3 .github/scripts/validate_neoforge_1211_jar.py "$JAR"
      - uses: actions/upload-artifact@v4
        with:
          name: mineiptv-neoforge-1.21.1
          path: neoforge/build/libs/mineiptv-neoforge-*.jar
          if-no-files-found: error
