name: build
on:
  push:
  pull_request:

jobs:
  build-neoforge-1-21-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build NeoForge 1.21.1
        run: gradle :neoforge:build --stacktrace --no-daemon
      - name: Validate NeoForge JAR
        shell: bash
        run: |
          JAR=$(find neoforge/build/libs -maxdepth 1 -type f -name 'mineiptv-neoforge-*.jar' ! -name '*sources*' | head -n 1)
          test -n "$JAR"
          unzip -t "$JAR"
          python3 .github/scripts/validate_neoforge_1211_jar.py "$JAR"
      - name: Dedicated server smoke test
        shell: bash
        run: |
          mkdir -p neoforge/runs/server
          printf 'eula=true\n' > neoforge/runs/server/eula.txt
          printf 'online-mode=false\n' > neoforge/runs/server/server.properties
          set +e
          timeout 120s gradle :neoforge:runServer --no-daemon --console=plain > server-smoke.log 2>&1
          code=$?
          set -e
          cat server-smoke.log
          if grep -Eq 'Done \([0-9.]+s\)!|For help, type' server-smoke.log; then
            exit 0
          fi
          echo "Dedicated server did not reach ready state (exit=$code)"
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: mineiptv-neoforge-1.21.1
          path: neoforge/build/libs/mineiptv-neoforge-*.jar
          if-no-files-found: error
