name: build
on:
  push:
  pull_request:

jobs:
  build-neoforge-1-21-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build NeoForge 1.21.1
        run: gradle :neoforge:build --stacktrace --no-daemon

      - name: Validate NeoForge JAR
        shell: bash
        run: |
          JAR=$(find neoforge/build/libs -maxdepth 1 -type f -name 'mineiptv-neoforge-*.jar' ! -name '*sources*' | head -n 1)
          test -n "$JAR"
          unzip -t "$JAR"
          python3 .github/scripts/validate_neoforge_1211_jar.py "$JAR"

      - name: Packaged JAR dedicated-server smoke test
        shell: bash
        run: |
          ROOT="$PWD"
          JAR=$(find neoforge/build/libs -maxdepth 1 -type f -name 'mineiptv-neoforge-*.jar' ! -name '*sources*' | head -n 1)
          test -n "$JAR"
          JAR="$ROOT/$JAR"

          SERVER_DIR=$(mktemp -d)
          cd "$SERVER_DIR"
          curl --fail --location --retry 3 \
            --output neoforge-installer.jar \
            "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.256/neoforge-21.1.256-installer.jar"
          java -jar neoforge-installer.jar --installServer
          mkdir -p mods
          cp "$JAR" mods/
          printf 'eula=true\n' > eula.txt
          printf 'online-mode=false\n' > server.properties

          set +e
          timeout 120s ./run.sh --nogui > packaged-server.log 2>&1
          code=$?
          set -e
          cat packaged-server.log

          grep -Fq 'MineIPTV 0.2.0-dev+1.21.1 (mineiptv)' packaged-server.log
          grep -Eq 'Done \([0-9.]+s\)!|For help, type' packaged-server.log
          if grep -Eqi 'Failed to load|Invalid mod|not a valid mod|ModLoadingException|Exception in thread' packaged-server.log; then
            echo 'Packaged server log contains a fatal mod-loading error.'
            exit 1
          fi
          echo "Packaged JAR loaded successfully (server exit=$code after timeout)."

      - uses: actions/upload-artifact@v4
        with:
          name: mineiptv-neoforge-1.21.1
          path: neoforge/build/libs/mineiptv-neoforge-*.jar
          if-no-files-found: error
