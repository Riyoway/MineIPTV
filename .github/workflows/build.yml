name: build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        loader: [fabric, neoforge, forge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - run: gradle :${{ matrix.loader }}:build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: mineiptv-${{ matrix.loader }}-26.3
          path: ${{ matrix.loader }}/build/libs/*.jar
