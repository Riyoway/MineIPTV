name: Sync MineIPTV source

on:
  push:
    branches: [main]
    paths:
      - ".source/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mineiptv-src
          cat .source/parts/* | base64 -d > /tmp/mineiptv-src.tar.xz
          expected="5ee807c69117f5f46172bdea94c39eaf36e9f114"
          actual="$(git hash-object /tmp/mineiptv-src.tar.xz)"
          if [ "$actual" != "$expected" ]; then
            echo "Archive Git blob SHA mismatch: $actual" >&2
            exit 1
          fi
          tar -xJf /tmp/mineiptv-src.tar.xz -C /tmp/mineiptv-src
          src="/tmp/mineiptv-src/MineIPTV-crossloader"
          test -d "$src/common"
          test -d "$src/fabric"
          test -d "$src/forge"
          test -d "$src/neoforge"

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.source/' \
            --exclude='.github/workflows/sync-source.yml' \
            "$src"/ ./

          rm -rf .source .github/workflows/sync-source.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update cross-loader multiplayer development build"
          git push origin HEAD:main
