plugins { id 'multiloader-common' }
configurations {
    commonJava { canBeResolved = false; canBeConsumed = true }
    commonResources { canBeResolved = false; canBeConsumed = true }
}
sourceSets.main.resources.srcDir file('src/main/generated')
dependencies {
    // Common sources only need the API at compile time. Each loader module provides
    // its matching Common Network runtime artifact, avoiding capability conflicts.
    compileOnly "mysticdrew:common-networking-common:${project.common_network_version}"
}
artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.files
}
