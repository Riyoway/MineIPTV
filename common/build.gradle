plugins { id 'multiloader-common' }
configurations {
    commonJava { canBeResolved = false; canBeConsumed = true }
    commonResources { canBeResolved = false; canBeConsumed = true }
}
sourceSets.main.resources.srcDir file('src/main/generated')
dependencies {
    // 1.21.1 NeoForge build uses NeoForge's native payload API in the loader module.
}
artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.files
}
